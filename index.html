<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustMap | Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
    <!-- top navigation bar -->
    <header class="topbar">
        <div class="topbar-container">
            <a href="index.html" class="logo">
                TrustMap
            </a>

            <nav class="main-nav" aria-label="Main navigation">
                <a href="index.html" class="nav-link active">
                    <span aria-hidden="true">
                        <i class="fa fa-home" aria-hidden="true"></i>
                    </span>
                    Home
                </a>

                <a href="device.html" class="nav-link">
                    <span aria-hidden="true">
                        <i class="fa fa-laptop" aria-hidden="true"></i>
                    </span>
                    Devices
                </a>

                <a href="#" class="nav-link">
                    <span aria-hidden="true">
                        <i class="fa fa-cog" aria-hidden="true"></i>
                    </span>
                    Settings
                </a>
            </nav>

            <button class="profile-button" aria-label="Open profile">
                <span aria-hidden="true">
                    <i class="fa fa-user" aria-hidden="true"></i>
                </span>
            </button>
        </div>
    </header>

    <!-- dashboard content -->
    <main class="dashboard">
        <section class="dashboard-intro">
            <h1>Good morning!</h1>
            <p> Here's what's connected to your network.</p>
        </section>

        <!-- network status cards -->
        <section class="status-grid" aria-label="Network status">
            <article class="status-card">
                <strong class="status-number" id="device-count">5</strong>
                <span aria-hidden="true">
                    <i class="fa fa-laptop" aria-hidden="true"></i>
                </span>
                <p>Devices</p>
            </article>

            <article class="status-card status-card-trusted">
                <strong class="status-number" id="trusted-count">3</strong>
                <span aria-hidden="true">
                    <i class="fa fa-user" aria-hidden="true"></i>
                </span>
                <p>Trusted</p>
            </article>

            <article class="status-card">
                <strong class="status-number" id="guest-count">1</strong>
                <span aria-hidden="true">
                    <i class="fa fa-user" aria-hidden="true"></i>
                </span>
                <p>Guest</p>
            </article>

            <article class="status-card status-card-attention">
                <strong class="status-number" id="attention-count">1</strong>
                <span aria-hidden="true">
                    <i class="fa fa-exclamation-triangle" aria-hidden="true"></i>
                </span>
                <p>Needs Attention</p>
            </article>
        </section>

        <!-- attention alert -->
        <section class="attention-alert" aria-label="Device attention required" id="network-alert">
            <span class="alert-icon" aria-hidden="true">
                <i class="fa fa-exclamation-triangle" aria-hidden="true"></i>
            </span>
            <div class="alert-message">
                <strong> 1 device needs attention </strong>
                <p> Review the unknown device below. </p>
            </div>

            <a href="device.html" class="alert-action" aria-label="Review unknown device">
                <i class="fa fa-angle-right" aria-hidden="true"></i>
            </a>
        </section>

        <!-- connected devices section -->
        <section class="devices-section" id="devices">
            <h2>Connected Devices</h2>

            <!-- SEARCH + FILTER -->
            <div class="device-controls">
                <label class="search-box">
                    <span aria-hidden="true"><i class="fa fa-search" aria-hidden="true"></i></span>
                    <input type="search" id="device-search" placeholder="Search devices..." aria-label="Search devices">
                </label>

                <select class="device-filter" id="device-filter" aria-label="Filter devices">
                    <option value="all">All Devices</option>
                    <option value="trusted">Trusted</option>
                    <option value="guest">Guest</option>
                    <option value="unknown">Unknown</option>
                </select>
            </div>

            <!-- devices table -->
            <div class="table-wrapper">
                <table class="device-table">
                    <thead>
                        <tr>
                            <th scope="col">Device Name</th>
                            <th scope="col">Type</th>
                            <th scope="col">Status</th>
                            <th scope="col">IP Address</th>
                            <th scope="col">
                                <span class="sr-only">Action</span>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="device-table-body"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
